---
name: Deploy Latest

on:  # yamllint disable-line
  push:
    branches:
      - 'main'

permissions:
  contents: read

jobs:

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: install
        uses: appleboy/ssh-action@25ce8cbbcb08177468c7ff7ec5cbfa236f9341e1 # v1.1.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          passphrase: ${{ secrets.PASSPHRASE }}
          script: |
            set -euo pipefail
            cd /opt/compose
            git fetch
            git checkout main
            git pull
            docker compose pull
            docker compose up -d
