---
name: Deploy Latest

on:  # yamllint disable-line
  push:
    branches:
      - 'main'

permissions:
  contents: read

jobs:

  deploy:
    permissions:
      contents: read
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: install
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ vars.HOST }}
          username: ${{ vars.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ vars.PORT }}
          passphrase: ${{ secrets.PASSPHRASE }}
          script: |
            set -euo pipefail
            cd /opt/compose
            git fetch
            git checkout main
            git pull
            docker compose pull
            docker compose up -d
            docker image prune -f
